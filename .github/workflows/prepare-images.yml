name: PVM OOT prepare images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Distribution kernel target
        type: choice
        default: all
        options:
          - all
          - ubuntu-24.04/6.8.0-139
          - ubuntu-26.04/7.0.0-30
          - centos-stream-10/6.12.0-267
          - amazon-linux-2023/6.18.54-121.166
          - alinux-4/6.6.102-7
          - opencloudos-9.4/6.6.119-52.9
      force:
        description: Rebuild even when a matching sealed image exists
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pvm-factory
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        env:
          PVM_TARGET: ${{ inputs.target }}
        run: |
          matrix=$(python3 tools/ci-matrix.py "$PVM_TARGET")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  prepare:
    needs: select
    environment: pvm-validation
    runs-on: [self-hosted, linux, x64, pvm]
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify sealed image
        env:
          PVM_FACTORY_CONFIG_DIR: ${{ vars.PVM_FACTORY_CONFIG_DIR }}
          PVM_TARGET: ${{ matrix.target }}
          PVM_FORCE_PREPARE: ${{ inputs.force && '1' || '0' }}
        run: |
          test -n "$PVM_FACTORY_CONFIG_DIR"
          config="$PVM_FACTORY_CONFIG_DIR/${PVM_TARGET//\//-}.env"
          test -f "$config"
          force=()
          if [[ "$PVM_FORCE_PREPARE" == 1 ]]; then
            force+=(--force)
          fi
          ./scripts/pvm-ci prepare "$PVM_TARGET" --env "$config" "${force[@]}"
